{% extends 'home.html' %}

<title>{% block title %}Удаление товара{% endblock %}</title>

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="text-center text-danger">⚠️ Удаление товара</h4>
            </div>
            <div class="card-body">
                <p class="text-center">Вы уверены, что хотите удалить товар:</p>
                <h5 class="text-center">{{ product.title }}</h5>

                {% if product.image %}
                <div class="text-center mb-3">
                    <img src="{{ product.image.url }}" alt="{{ product.title }}" style="max-height: 150px;">
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
